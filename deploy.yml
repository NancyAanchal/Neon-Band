# Builds Neon Band and deploys it to GitHub Pages on every push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Lets you run it manually from the Actions tab
  workflow_dispatch:

# Permissions GitHub Pages needs to publish
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older one
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5